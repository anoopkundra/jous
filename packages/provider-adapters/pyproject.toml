[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jous-provider-adapters"
version = "0.1.0"
description = "Jous-owned neutral supplier contract boundary"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "tokenizers==0.22.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jous_supply = ["model_assets/qwen3_32b/*"]
