[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jous-api"
version = "0.1.0"
description = "Jous control-plane foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "SQLAlchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "PyJWT[crypto]==2.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]
